<!doctype html>

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="description" content="Entrate, uscite e budget di Matteo">

<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">

<meta name="theme-color" content="#252525" media="(prefers-color-scheme: dark)">

<style>
/* Layout: design system shadcn/ui (new-york, neutral). Mobile: colonna singola + tab bar in basso + drawer. Desktop: tab nell'header + dialog centrato */
:root{
  --radius:.625rem;
  --background:oklch(0.985 0 0); --foreground:oklch(0.145 0 0);
  --card:oklch(1 0 0); --card-foreground:oklch(0.145 0 0);
  --popover:oklch(1 0 0);
  --primary:oklch(0.205 0 0); --primary-foreground:oklch(0.985 0 0);
  --secondary:oklch(0.97 0 0); --muted:oklch(0.96 0 0); --muted-foreground:oklch(0.556 0 0);
  --accent:oklch(0.97 0 0);
  --destructive:oklch(0.577 0.245 27.325); --destructive-soft:oklch(0.577 0.245 27.325 / 12%);
  --success:oklch(0.596 0.145 163.225); --success-soft:oklch(0.596 0.145 163.225 / 12%);
  --warning:oklch(0.666 0.179 58.318); --warning-soft:oklch(0.769 0.188 70.08 / 18%);
  --border:oklch(0.922 0 0); --input:oklch(0.922 0 0); --ring:oklch(0.708 0 0);
  --chart-1:oklch(0.646 0.222 41.116); --chart-2:oklch(0.6 0.118 184.704); --chart-3:oklch(0.398 0.07 227.392);
  --chart-4:oklch(0.828 0.189 84.429); --income:oklch(0.546 0.245 262.881);
  --overlay:oklch(0 0 0 / 50%);
  --shadow-xs:0 1px 2px 0 oklch(0 0 0 / 5%);
  --shadow-sm:0 1px 3px 0 oklch(0 0 0 / 8%),0 1px 2px -1px oklch(0 0 0 / 8%);
  --shadow-lg:0 10px 15px -3px oklch(0 0 0 / 10%),0 4px 6px -4px oklch(0 0 0 / 10%);
  --font-sans:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --font-mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --background:oklch(0.145 0 0); --foreground:oklch(0.985 0 0);
  --card:oklch(0.205 0 0); --card-foreground:oklch(0.985 0 0); --popover:oklch(0.205 0 0);
  --primary:oklch(0.922 0 0); --primary-foreground:oklch(0.205 0 0);
  --secondary:oklch(0.269 0 0); --muted:oklch(0.269 0 0); --muted-foreground:oklch(0.708 0 0); --accent:oklch(0.269 0 0);
  --destructive:oklch(0.704 0.191 22.216); --destructive-soft:oklch(0.704 0.191 22.216 / 16%);
  --success:oklch(0.696 0.17 162.48); --success-soft:oklch(0.696 0.17 162.48 / 16%);
  --warning:oklch(0.795 0.184 86.047); --warning-soft:oklch(0.795 0.184 86.047 / 16%);
  --border:oklch(1 0 0 / 10%); --input:oklch(1 0 0 / 15%); --ring:oklch(0.556 0 0);
  --chart-1:oklch(0.705 0.213 47.604); --chart-2:oklch(0.696 0.17 162.48); --chart-3:oklch(0.623 0.214 259.815);
  --chart-4:oklch(0.795 0.184 86.047); --income:oklch(0.707 0.165 254.624);
  --overlay:oklch(0 0 0 / 65%); color-scheme:dark}}
:root[data-theme="dark"]{
  --background:oklch(0.145 0 0); --foreground:oklch(0.985 0 0);
  --card:oklch(0.205 0 0); --card-foreground:oklch(0.985 0 0); --popover:oklch(0.205 0 0);
  --primary:oklch(0.922 0 0); --primary-foreground:oklch(0.205 0 0);
  --secondary:oklch(0.269 0 0); --muted:oklch(0.269 0 0); --muted-foreground:oklch(0.708 0 0); --accent:oklch(0.269 0 0);
  --destructive:oklch(0.704 0.191 22.216); --destructive-soft:oklch(0.704 0.191 22.216 / 16%);
  --success:oklch(0.696 0.17 162.48); --success-soft:oklch(0.696 0.17 162.48 / 16%);
  --warning:oklch(0.795 0.184 86.047); --warning-soft:oklch(0.795 0.184 86.047 / 16%);
  --border:oklch(1 0 0 / 10%); --input:oklch(1 0 0 / 15%); --ring:oklch(0.556 0 0);
  --chart-1:oklch(0.705 0.213 47.604); --chart-2:oklch(0.696 0.17 162.48); --chart-3:oklch(0.623 0.214 259.815);
  --chart-4:oklch(0.795 0.184 86.047); --income:oklch(0.707 0.165 254.624);
  --overlay:oklch(0 0 0 / 65%); color-scheme:dark}

*{box-sizing:border-box;border-color:var(--border)}
html,body{background:var(--background);color:var(--foreground)}
body{font-family:var(--font-sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 128px}
.mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance}
button,input,select{font:inherit;color:inherit}
svg.i{width:16px;height:16px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.muted{color:var(--muted-foreground)}
.xs{font-size:12px}.sm{font-size:13px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:8px}
.between{display:flex;align-items:center;justify-content:space-between;gap:8px}
.grow{flex:1;min-width:0}

/* header */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in oklab,var(--background) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.hdr .in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px}
.brand{font-weight:600;font-size:14px;display:none}
.month{display:flex;align-items:center;gap:4px}
.month .lbl{font-weight:600;font-size:16px;text-transform:capitalize;min-width:0;padding-inline:4px;white-space:nowrap}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);margin-left:auto}
.sync::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--success)}
.sync[data-s="busy"]::before{background:var(--warning)} .sync[data-s="err"]::before{background:var(--destructive)}
.tlist.dtabs{display:none}

/* button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;border-radius:calc(var(--radius) - 2px);font-size:14px;font-weight:500;height:36px;padding:0 16px;border:1px solid transparent;cursor:pointer;transition:background .15s,color .15s,box-shadow .15s;user-select:none}
.btn:disabled{opacity:.5;pointer-events:none}
.btn:focus-visible,.inp:focus-visible,.tog:focus-visible,.tab:focus-visible,.trow:focus-visible,.crow:focus-visible{outline:none;border-color:var(--ring);box-shadow:0 0 0 3px color-mix(in oklab,var(--ring) 50%,transparent)}
.b-default{background:var(--primary);color:var(--primary-foreground);box-shadow:var(--shadow-xs)}
.b-default:hover{background:color-mix(in oklab,var(--primary) 90%,transparent)}
.b-outline{background:var(--card);border-color:var(--border);box-shadow:var(--shadow-xs)}
.b-outline:hover{background:var(--accent)}
.b-secondary{background:var(--secondary)}
.b-ghost{background:transparent}
.b-ghost:hover{background:var(--accent)}
.b-destructive{background:var(--destructive);color:#fff}
.b-dghost{background:transparent;color:var(--destructive)}
.b-dghost:hover{background:var(--destructive-soft)}
.b-sm{height:32px;padding:0 12px;font-size:13px;gap:6px}
.b-icon{width:36px;padding:0}.b-icon.b-sm{width:32px}

/* card */
.card{background:var(--card);color:var(--card-foreground);border:1px solid var(--border);border-radius:calc(var(--radius) + 4px);box-shadow:var(--shadow-xs)}
.card-h{padding:18px 18px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.card-t{font-size:15px;font-weight:600;line-height:1.3}
.card-d{font-size:13px;color:var(--muted-foreground);margin-top:2px}
.card-c{padding:16px 18px 18px}
.card-c.flush{padding:6px 6px 8px}

/* badge */
.badge{display:inline-flex;align-items:center;gap:4px;border:1px solid transparent;border-radius:calc(var(--radius) - 4px);padding:1px 7px;font-size:11.5px;font-weight:500;white-space:nowrap;line-height:1.5}
.bd-secondary{background:var(--secondary);color:var(--foreground)}
.bd-outline{border-color:var(--border);color:var(--foreground)}
.bd-destructive{background:var(--destructive-soft);color:var(--destructive)}
.bd-warning{background:var(--warning-soft);color:var(--warning)}
.bd-success{background:var(--success-soft);color:var(--success)}

/* progress */
.prog{position:relative;height:8px;border-radius:999px;background:color-mix(in oklab,var(--primary) 12%,transparent);overflow:hidden}
.prog>i{position:absolute;inset:0 auto 0 0;border-radius:999px;background:var(--primary);transition:width .3s}
.prog>i.warn{background:var(--warning)}.prog>i.over{background:var(--destructive)}
.prog>u{position:absolute;top:0;bottom:0;width:2px;background:var(--foreground);opacity:.35}
.prog.lg{height:10px}

/* hero */
.hero .lbl{font-size:13px;color:var(--muted-foreground);font-weight:500}
.hero .big{font-size:40px;font-weight:600;letter-spacing:-.035em;line-height:1.1;margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{padding:12px 14px;min-width:0}
.stat .l{font-size:12px;color:var(--muted-foreground);display:flex;align-items:center;gap:6px}
.stat .v{font-size:17px;font-weight:600;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.02em}

/* category rows */
.crow{display:grid;grid-template-columns:minmax(0,1fr);gap:7px;width:100%;padding:11px 12px;border-radius:calc(var(--radius) - 2px);background:none;border:1px solid transparent;text-align:left;cursor:pointer}
.crow:hover{background:color-mix(in oklab,var(--muted) 60%,transparent)}
.crow .nm{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .vl{font-size:13px;color:var(--muted-foreground);white-space:nowrap}
.crow .vl b{color:var(--foreground);font-weight:500}
.sep{height:1px;background:var(--border);margin:0 12px}

/* group dot */
.gd{width:8px;height:8px;border-radius:2px;flex:none;display:inline-block}
.g-ess{background:var(--chart-2)}.g-ext{background:var(--chart-1)}.g-ris{background:var(--chart-3)}.g-fondo{background:var(--muted-foreground)}.g-inc{background:var(--income)}

/* transactions */
.dayh{display:flex;justify-content:space-between;align-items:baseline;padding:14px 12px 6px;font-size:12px;font-weight:500;color:var(--muted-foreground)}
.dayh span:first-child::first-letter{text-transform:uppercase}
.trow{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:9px 12px;background:none;border:1px solid transparent;border-radius:calc(var(--radius) - 2px);text-align:left;cursor:pointer}
.trow:hover{background:color-mix(in oklab,var(--muted) 60%,transparent)}
.ava{width:36px;height:36px;border-radius:calc(var(--radius) - 2px);display:grid;place-items:center;background:var(--muted)}
.ava.g-ess{background:color-mix(in oklab,var(--chart-2) 16%,transparent);color:var(--chart-2)}
.ava.g-ext{background:color-mix(in oklab,var(--chart-1) 16%,transparent);color:var(--chart-1)}
.ava.g-ris{background:color-mix(in oklab,var(--chart-3) 16%,transparent);color:var(--chart-3)}
.ava.g-fondo{background:var(--muted);color:var(--muted-foreground)}
.ava.g-inc{background:color-mix(in oklab,var(--income) 14%,transparent);color:var(--income)}
.trow .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .t2{font-size:12.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .am{font-weight:500;font-size:14px}
.trow .am.inc{color:var(--income)}

/* form */
.inp{display:flex;height:36px;width:100%;min-width:0;border-radius:calc(var(--radius) - 2px);border:1px solid var(--input);background:transparent;padding:4px 12px;font-size:14px;box-shadow:var(--shadow-xs);outline:none;transition:border-color .15s,box-shadow .15s}
.inp::placeholder{color:var(--muted-foreground)}
select.inp{padding-right:8px;background:var(--card)}
.inp.num{text-align:right;font-family:var(--font-mono);width:96px}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lab{font-size:13px;font-weight:500}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--primary)}

/* tabs (segmented) */
.tlist{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--muted);border-radius:var(--radius);padding:3px;height:36px;width:100%}
.tab{border:1px solid transparent;background:none;border-radius:calc(var(--radius) - 2px);font-size:14px;font-weight:500;color:var(--muted-foreground);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px}
.tab[aria-selected="true"]{background:var(--card);color:var(--foreground);box-shadow:var(--shadow-sm)}

/* toggles */
.togs{display:flex;flex-wrap:wrap;gap:6px}
.tog{display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 11px;border-radius:calc(var(--radius) - 2px);border:1px solid var(--input);background:var(--card);font-size:13px;font-weight:500;cursor:pointer;box-shadow:var(--shadow-xs)}
.tog:hover{background:var(--accent)}
.tog[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-foreground)}

/* bottom nav */
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in oklab,var(--card) 92%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--border);padding-bottom:env(safe-area-inset-bottom,0px)}
.bnav .in{display:grid;grid-template-columns:repeat(5,1fr);max-width:760px;margin:0 auto}
.bnav button{border:0;background:none;padding:9px 2px 10px;font-size:11px;font-weight:500;color:var(--muted-foreground);display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.bnav button svg.i{width:20px;height:20px}
.bnav button[aria-current="page"]{color:var(--foreground)}
.fab{position:fixed;right:16px;bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:31;height:48px;padding:0 18px 0 14px;border-radius:999px;box-shadow:var(--shadow-lg);font-size:15px}
.fab svg.i{width:20px;height:20px}
body[data-view="budget"] .fab,body[data-view="altro"] .fab{display:none}

/* drawer / dialog */
.ovl{position:fixed;inset:0;z-index:50;background:var(--overlay);display:flex;align-items:flex-end;justify-content:center}
.drawer{background:var(--background);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;border-top:1px solid var(--border);padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.handle{width:90px;height:5px;border-radius:99px;background:var(--muted);margin:10px auto 0;flex:none}
.amt{display:flex;align-items:baseline;gap:6px;justify-content:center;padding-block:4px}
.amt span{font-size:28px;color:var(--muted-foreground);font-family:var(--font-mono)}
.amt input{border:0;background:none;outline:none;font-family:var(--font-mono);font-size:44px;font-weight:500;letter-spacing:-.04em;width:7ch;min-width:0;text-align:left;padding:0}
.amt input::placeholder{color:color-mix(in oklab,var(--muted-foreground) 50%,transparent)}
.dfoot{display:flex;gap:8px;align-items:center}

/* table */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{height:38px;padding:0 8px;text-align:left;font-weight:500;color:var(--muted-foreground);white-space:nowrap;border-bottom:1px solid var(--border)}
td{padding:6px 8px;border-bottom:1px solid var(--border);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:color-mix(in oklab,var(--muted) 45%,transparent)}
th.r,td.r{text-align:right}
td .inp{height:32px}
td .inp.num{margin-left:auto}

/* alert, toast, empty */
.alert{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:12px 14px;border:1px solid var(--border);border-radius:var(--radius);background:var(--card)}
.alert .t{font-weight:500}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(132px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--popover);color:var(--foreground);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:11px 16px;border-radius:var(--radius);font-weight:500;font-size:13.5px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.toast svg.i{color:var(--success)}
.empty{padding:28px 12px;text-align:center;color:var(--muted-foreground);display:flex;flex-direction:column;align-items:center;gap:8px}
.skel{height:14px;border-radius:6px;background:var(--muted);animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{opacity:.5}}

/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{font-family:var(--font-mono);font-size:10px;fill:var(--muted-foreground)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.stickybar{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:15;display:flex;justify-content:flex-end;padding-block:12px}
h1.pt{font-size:22px;font-weight:600;letter-spacing:-.02em}

@media (min-width:768px){
  .wrap{padding-block:0 64px}
  .brand{display:block}
  .tlist.dtabs{display:inline-grid;width:auto;margin-left:12px}
  .dtabs .tab{font-size:13px}
  .bnav,.fab{display:none}
  .hdr-new{display:inline-flex!important}
  .ovl{align-items:center}
  .drawer{border-radius:calc(var(--radius) + 4px);border:1px solid var(--border);box-shadow:var(--shadow-lg);padding:20px 22px 22px;max-width:520px}
  .handle{display:none}
  .toast{bottom:28px}
  .stickybar{bottom:0}
}
@media (max-width:420px){.hero .big{font-size:34px}.stat{padding:10px 11px}.stat .v{font-size:15px}.card-h{padding:16px 16px 0}.card-c{padding:14px 16px 16px}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:dIn .2s cubic-bezier(.32,.72,0,1)}@keyframes dIn{from{transform:translateY(24px);opacity:.5}}.toast{animation:tIn .2s ease-out}@keyframes tIn{from{transform:translate(-50%,8px);opacity:0}}}
</style>
<style>:root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}</style>

<style>
.login{min-height:100%;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.login .box{width:100%;max-width:380px}
.login .logo{width:72px;height:72px;border-radius:18px;display:block;margin:0 auto 16px;box-shadow:var(--shadow-lg)}
.login h1{text-align:center;font-size:24px;font-weight:600;letter-spacing:-.02em}
.login p.sub{text-align:center;color:var(--muted-foreground);margin:4px 0 20px}
.login .msg{font-size:13px;min-height:18px}
html,body{height:100%}
</style>
</head>
<body>


<header class="hdr"><div class="in">
  <span class="brand">Conti</span>
  <div class="month">
    <button class="btn b-ghost b-icon b-sm" id="prevM" aria-label="Mese precedente"><svg class="i" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
    <span class="lbl" id="mlabel">—</span>
    <button class="btn b-ghost b-icon b-sm" id="nextM" aria-label="Mese successivo"><svg class="i" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button>
  </div>
  <div class="tlist dtabs" role="tablist" aria-label="Sezioni" id="dtabs"></div>
  <span class="sync" id="status" data-s="busy">Caricamento</span>
  <button class="btn b-default b-sm hdr-new" id="newBtn" style="display:none"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>Nuovo</button>
</div></header>

<main class="wrap" id="view"><div class="stack" style="margin-top:20px"><div class="card card-c stack"><div class="skel" style="width:40%"></div><div class="skel" style="height:36px;width:60%"></div><div class="skel"></div></div></div></main>

<button class="btn b-default fab" id="fab" aria-label="Aggiungi movimento"><svg class="i" viewBox="0 0 24 24"><path d="M5 12h14M12 5v14"/></svg>Aggiungi</button>

<nav class="bnav" aria-label="Sezioni"><div class="in" id="bnav"></div></nav>

<script>
(() => {
"use strict";
/* ---------- icone (lucide) ---------- */
const ICONS = {
  dash:'<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
  list:'<path d="M3 12h.01M3 18h.01M3 6h.01M8 12h13M8 18h13M8 6h13"/>',
  chart:'<path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="M18 17V9M13 17V5M8 17v-3"/>',
  wallet:'<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
  sliders:'<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/>',
  out:'<path d="M7 7h10v10M7 17 17 7"/>',
  in:'<path d="M17 7 7 17M17 17H7V7"/>',
  cal:'<rect width="18" height="18" x="3" y="4" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  repeat:'<path d="m17 2 4 4-4 4M3 11v-1a4 4 0 0 1 4-4h14M7 22l-4-4 4-4M21 13v1a4 4 0 0 1-4 4H3"/>',
  up:'<path d="M16 7h6v6M22 7l-8.5 8.5-5-5L2 17"/>',
  down:'<path d="M16 17h6v-6M22 17l-8.5-8.5-5 5L2 7"/>',
  dl:'<path d="M12 15V3M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5"/>',
  trash:'<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  x:'<path d="M18 6 6 18M6 6l12 12"/>',
  plus:'<path d="M5 12h14M12 5v14"/>',
  check:'<path d="M20 6 9 17l-5-5"/>',
  info:'<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
  piggy:'<path d="M11 17h3v2a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1v-3a3.16 3.16 0 0 0 2-2h1a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1h-1a5 5 0 0 0-2-4V3a4 4 0 0 0-3.2 1.6l-.3.4H11a6 6 0 0 0-6 6v1a5 5 0 0 0 2 4v3a1 1 0 0 0 1 1h2a1 1 0 0 0 1-1z"/><path d="M16 10h.01M2 8v1a2 2 0 0 0 2 2h1"/>'
};
const ic = (n, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${ICONS[n] || ""}</svg>`;
const TABS = [{id:"mese", n:"Mese", i:"dash"}, {id:"movimenti", n:"Movimenti", i:"list"}, {id:"andamento", n:"Andamento", i:"chart"}, {id:"budget", n:"Budget", i:"wallet"}, {id:"altro", n:"Impostazioni", i:"sliders"}];

/* ---------- utilità ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const EUR = new Intl.NumberFormat("it-IT", {style:"currency", currency:"EUR", minimumFractionDigits:2, maximumFractionDigits:2});
const EUR0 = new Intl.NumberFormat("it-IT", {style:"currency", currency:"EUR", maximumFractionDigits:0});
const eur = n => EUR.format(Math.round((n || 0) * 100) / 100);
const eur0 = n => EUR0.format(Math.round(n || 0));
const sgn = n => (n >= 0 ? "+" : "−") + eur0(Math.abs(n));
const r2 = n => Math.round((n || 0) * 100) / 100;
const parseAmt = s => { if (typeof s === "number") return s; s = String(s || "").trim().replace(/\s/g, "").replace(/€/g, ""); if (s.includes(",")) s = s.replace(/\./g, "").replace(",", "."); const n = parseFloat(s); return isFinite(n) ? n : NaN; };
const pad = n => String(n).padStart(2, "0");
const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const curMonth = () => todayISO().slice(0, 7);
const addMonth = (m, k) => { let [y, mo] = m.split("-").map(Number); mo += k; while (mo > 12) { mo -= 12; y++; } while (mo < 1) { mo += 12; y--; } return `${y}-${pad(mo)}`; };
const monthDiff = (a, b) => { const [ya, ma] = a.split("-").map(Number), [yb, mb] = b.split("-").map(Number); return (yb - ya) * 12 + (mb - ma); };
const daysIn = m => { const [y, mo] = m.split("-").map(Number); return new Date(y, mo, 0).getDate(); };
const mLabel = (m, opt = {month:"long", year:"numeric"}) => { const [y, mo] = m.split("-").map(Number); return new Intl.DateTimeFormat("it-IT", opt).format(new Date(y, mo - 1, 1)); };
const mShort = m => mLabel(m, {month:"short"}).replace(".", "");
const mLong = m => mLabel(m, {month:"long"});
const dayLabel = iso => { const t = todayISO(); const y = new Date(); y.setDate(y.getDate() - 1);
  if (iso === t) return "Oggi"; if (iso === isoOf(y)) return "Ieri";
  const [a, b, c] = iso.split("-").map(Number); return new Intl.DateTimeFormat("it-IT", {weekday:"long", day:"numeric", month:"long"}).format(new Date(a, b - 1, c)); };
const GROUPS = [{id:"ess", name:"Essenziali", d:"Spese di base"}, {id:"ext", name:"Extra", d:"Tempo libero e acquisti"}, {id:"ris", name:"Risparmio", d:"Quello che metti da parte"}];

/* ---------- stato ---------- */
const S = { db:null, cfg:null, cfgLoaded:false, month:curMonth(), tx:[], txLoaded:false, budget:null, budgetLoaded:false, prevBudget:null,
  fundTx:[], incTx:[], view:"mese", unsubTx:null, unsubBud:null, trendCache:null, tagFilter:"", catFilter:"", tagAll:null, budgetDraft:null, settingsDirty:false, trendCat:"" };

const toast = msg => { document.querySelectorAll(".toast").forEach(t => t.remove()); const t = document.createElement("div"); t.className = "toast"; t.setAttribute("role", "status"); t.innerHTML = ic("check") + esc(msg); document.body.appendChild(t); setTimeout(() => t.remove(), 2400); };
const setStatus = (s, k = "ok") => { const el = $("#status"); el.textContent = s; el.dataset.s = k; };

/* ---------- configurazione derivata ---------- */
const cats = () => (S.cfg?.categories || []).filter(c => !c.hidden);
const catById = id => (S.cfg?.categories || []).find(c => c.id === id);
const srcById = id => (S.cfg?.sources || []).find(s => s.id === id);
const annualById = id => (S.cfg?.annual || []).find(a => a.id === id);
const mineA = a => (Number(a.amount) || 0) * ((a.share ?? 100) / 100);
const started = m => !!(S.cfg?.startMonth && m >= S.cfg.startMonth);
/* accantonamento delle spese annuali che NON sono abbonamenti (riga "Spese annuali") */
const monthlyAccrual = () => (S.cfg?.annual || []).filter(a => !a.sub).reduce((s, a) => s + mineA(a) / 12, 0);
/* tutto quello che entra nel fondo (anche gli abbonamenti annuali) */
const monthlyAccrualAll = () => (S.cfg?.annual || []).reduce((s, a) => s + mineA(a) / 12, 0);
const accrualFor = m => started(m) ? monthlyAccrual() : 0;
const annSubs = () => (S.cfg?.annual || []).filter(a => a.sub);
const annSubsMonthly = () => annSubs().reduce((s, a) => s + mineA(a) / 12, 0);
const SUBCAT = "abbonamenti";
const subs = () => (S.cfg?.recurring || []).filter(x => x.cat === SUBCAT);
const subsMonthlyRec = () => subs().reduce((a, x) => a + (Number(x.amount) || 0), 0);
const subsTotal = (m = S.month) => subsMonthlyRec() + (started(m) ? annSubsMonthly() : 0);
const isAuto = c => c?.id === SUBCAT && !!catById(SUBCAT);
const restCat = () => { const id = S.cfg?.restCat || "salvadanaio"; return catById(id) && !catById(id).hidden ? id : null; };
const isRest = c => !!c && c.id === restCat();
const baseBud = (c, budCats, m) => isAuto(c) ? subsTotal(m) : (Number(budCats?.[c.id]) || 0);
/* tutto quello che non è assegnato alle altre categorie va nella categoria "resto": ogni euro ha una destinazione */
function restFor(budCats, m = S.month) {
  const others = (S.cfg?.categories || []).filter(c => !isRest(c) && (!c.hidden || Number(budCats?.[c.id]))).reduce((a, c) => a + baseBud(c, budCats, m), 0);
  return incomeFor(m).monthly - others - accrualFor(m);
}
const budOf = (c, budCats, m = S.month) => isRest(c) ? Math.max(0, restFor(budCats, m)) : baseBud(c, budCats, m);
const isFixedSrc = id => Number(srcById(id)?.fixed) > 0;
const fixedMonthly = () => (S.cfg?.sources || []).reduce((a, x) => a + (Number(x.fixed) || 0), 0);
/* netto fatturato (fonti non fisse) in un mese: prima dell'avvio dallo storico, poi dai movimenti */
function invoicedIn(m) {
  const start = S.cfg?.startMonth || "0000-00";
  if (m < start) return Number(S.cfg?.incomeHistory?.[m]) || 0;
  return S.incTx.filter(t => t.month === m && !isFixedSrc(t.src)).reduce((a, t) => a + (Number(t.amount) || 0), 0);
}
function grossIn(m) {
  const start = S.cfg?.startMonth || "0000-00";
  if (m < start) return Number(S.cfg?.incomeHistoryGross?.[m]) || 0;
  return S.incTx.filter(t => t.month === m && !isFixedSrc(t.src)).reduce((a, t) => a + (Number(t.gross) || 0), 0);
}
/* entrate mensili = importi fissi (borsa) + netto fatturato negli ultimi 12 mesi / 12 */
function incomeFor(m) {
  let pool = 0; for (let k = addMonth(m, -11); k <= m; k = addMonth(k, 1)) pool += invoicedIn(k);
  const fixed = fixedMonthly();
  return {fixed, pool, monthly:fixed + pool / 12, invoiced:invoicedIn(m)};
}

function budgetFor() {
  if (S.budget?.cats) return {cats:S.budget.cats, draft:false};
  if (S.prevBudget?.cats) return {cats:S.prevBudget.cats, draft:true, from:S.prevBudget.month};
  const o = {}; cats().forEach(c => o[c.id] = Number(c.defaultBudget) || 0);
  return {cats:o, draft:true, from:null};
}

/* ---------- calcoli del mese ---------- */
function computeMonth(txs, budCats, m) {
  const isCur = m === curMonth(), isPast = m < curMonth();
  const day = isCur ? new Date().getDate() : (isPast ? daysIn(m) : 0);
  const frac = daysIn(m) ? day / daysIn(m) : 0;
  const spent = {}; const inc = incomeFor(m); const income = inc.monthly;
  for (const t of txs) {
    if (t.kind === "inc") continue;
    if (t.cat === "fondo") continue;
    spent[t.cat] = (spent[t.cat] || 0) + (Number(t.amount) || 0);
  }
  if (started(m) && annSubs().length) spent[SUBCAT] = (spent[SUBCAT] || 0) + annSubsMonthly();
  const rows = (S.cfg?.categories || []).filter(c => !c.hidden || spent[c.id] || Number(budCats?.[c.id])).map(c => {
    const b = budOf(c, budCats, m), s = spent[c.id] || 0;
    let proj;
    if (c.fixed) proj = Math.max(s, b);
    else if (isPast) proj = s;
    else if (!isCur) proj = Math.max(s, b);
    else proj = frac >= 0.1 ? s / frac : Math.max(s, b);
    return {c, b, s, proj, left:b - s};
  });
  const acc = accrualFor(m);
  const sum = f => rows.reduce((a, r) => a + f(r), 0);
  const budTot = sum(r => r.b) + acc, spentTot = sum(r => r.s) + acc, projTot = sum(r => r.proj) + acc;
  const ris = sum(r => r.c.group === "ris" ? r.s : 0), risProj = sum(r => r.c.group === "ris" ? r.proj : 0);
  return {rows, acc, budTot, spentTot, projTot, income, inc, ris, risProj, consumi:spentTot - ris, consumiProj:projTot - risProj, frac, isCur, isPast};
}

/* ---------- avvio ---------- */
async function boot() {
  drawNav();
  const db = window.__db;
  if (!db) { setStatus("Non disponibile", "err"); $("#view").innerHTML = `<div class="stack" style="margin-top:20px"><div class="card empty">${ic("info")}<div>Il database non è disponibile in questa vista. Apri la pagina da claude.ai dopo aver effettuato l'accesso.</div></div></div>`; return; }
  S.db = db;
  window.__cloud?.onStatus(s => setStatus(s === "ok" ? "Sincronizzato" : s === "busy" ? "Salvataggio" : "Offline", s === "ok" ? "ok" : s === "busy" ? "busy" : "err"));
  db.doc("config/main").onSnapshot(snap => {
    S.cfg = snap.exists ? structuredClone(snap.data()) : null; S.cfgLoaded = true; S.trendCache = null; render();
  }, e => fail(e));
  db.collection("tx").where("kind", "==", "inc").onSnapshot(snap => { S.incTx = snap.docs.map(d => ({id:d.id, ...d.data()})); S.trendCache = null; render(); }, e => fail(e));
  db.collection("tx").where("cat", "==", "fondo").onSnapshot(snap => { S.fundTx = snap.docs.map(d => ({id:d.id, ...d.data()})); render(); }, e => fail(e));
  subscribeMonth();
}
function fail(e) { console.error(e); setStatus("Errore", "err"); toast(e?.code === "quota_exceeded" ? "Spazio esaurito nel database" : "Errore di connessione, riprova"); }

function subscribeMonth() {
  S.unsubTx?.(); S.unsubBud?.();
  S.txLoaded = false; S.budgetLoaded = false; S.tx = []; S.budget = null; S.prevBudget = null; S.budgetDraft = null;
  const m = S.month;
  S.unsubTx = S.db.collection("tx").where("month", "==", m).onSnapshot(snap => {
    S.tx = snap.docs.map(d => ({id:d.id, ...d.data()})).sort((a, b) => (b.date || "").localeCompare(a.date || "") || (b.created || 0) - (a.created || 0));
    S.txLoaded = true; render();
  }, e => fail(e));
  S.unsubBud = S.db.doc("budgets/" + m).onSnapshot(async snap => {
    S.budget = snap.exists ? snap.data() : null;
    if (!S.budget && !S.prevBudget) {
      try { const q = await S.db.collection("budgets").where("month", "<", m).orderBy("month", "desc").limit(1).get(); S.prevBudget = q.empty ? null : q.docs[0].data(); } catch (e) { console.warn(e); }
    }
    S.budgetLoaded = true; render();
  }, e => fail(e));
  $("#mlabel").textContent = mLabel(m);
}

/* ---------- render ---------- */
function drawNav() {
  $("#bnav").innerHTML = TABS.map(t => `<button data-tab="${t.id}" aria-current="${S.view === t.id ? "page" : "false"}">${ic(t.i)}${t.n}</button>`).join("");
  $("#dtabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" data-tab="${t.id}" aria-selected="${S.view === t.id}">${t.n}</button>`).join("");
}
function render() {
  drawNav();
  document.body.dataset.view = S.view;
  $("#mlabel").textContent = mLabel(S.month);
  const v = $("#view");
  if (!S.cfgLoaded) return;
  if (!S.cfg) { v.innerHTML = `<div class="stack" style="margin-top:20px"><div class="card empty">${ic("piggy")}<div style="font-weight:600;color:var(--foreground)">Benvenuto in Conti</div><div>Il tuo account è vuoto. Importa il file di backup con i tuoi dati per iniziare.</div><label class="btn b-default" for="backupFile0" style="cursor:pointer;margin-top:6px">${ic("plus")}Importa backup</label><input type="file" id="backupFile0" accept=".json,application/json" hidden></div></div>`; return; }
  const keep = document.activeElement?.id; const sel = keep && document.activeElement.selectionStart;
  let html = null;
  if (S.view === "mese") html = viewMese();
  else if (S.view === "movimenti") html = viewMovimenti();
  else if (S.view === "andamento") html = viewAndamento();
  else if (S.view === "budget") html = viewBudget();
  else if (S.view === "altro") { if (!v.querySelector("#settings") || !S.settingsDirty) html = viewAltro(); }
  if (html != null) v.innerHTML = `<div class="stack" style="margin-top:20px">${html}</div>`;
  if (S.view === "andamento") loadTrend();
  if (keep) { const el = document.getElementById(keep); if (el) { el.focus(); try { if (sel != null) el.setSelectionRange(sel, sel); } catch {} } }
}

function progHtml(s, b, proj, lg) {
  const max = Math.max(b, s, proj || 0, 1);
  const cls = b <= 0 ? (s > 0 ? "over" : "") : s > b ? "over" : (proj && proj > b) ? "warn" : "";
  const pm = proj && proj > s ? `<u style="left:calc(${Math.min(100, proj / max * 100)}% - 1px)" title="Proiezione a fine mese"></u>` : "";
  const bm = b > 0 && b < max ? `<u style="left:calc(${b / max * 100}% - 1px);opacity:.6;background:var(--card)"></u>` : "";
  return `<div class="prog ${lg ? "lg" : ""}" role="progressbar" aria-valuemin="0" aria-valuemax="${Math.round(b)}" aria-valuenow="${Math.round(s)}"><i class="${cls}" style="width:${Math.min(100, s / max * 100)}%"></i>${bm}${pm}</div>`;
}

function viewMese() {
  const bud = budgetFor(); const r = computeMonth(S.tx, bud.cats, S.month);
  const left = r.budTot - r.spentTot, projLeft = r.budTot - r.projTot, saldo = r.income - r.spentTot;
  const pct = r.budTot ? Math.round(r.spentTot / r.budTot * 100) : 0;
  let h = "";
  if (bud.draft && S.budgetLoaded) h += `<div class="alert"><div class="row" style="align-items:flex-start">${ic("info")}<div><div class="t">Budget di ${esc(mLong(S.month))} da confermare</div><div class="muted sm">Per ora uso ${bud.from ? "quello di " + esc(mLong(bud.from)) : "i valori predefiniti"}.</div></div></div><button class="btn b-outline b-sm" data-act="goto-budget">Rivedi budget</button></div>`;
  if (restCat() && started(S.month)) { const rr = restFor(bud.cats), mn = restMin(), rn = catById(restCat()).name;
    if (rr < -0.5) h += `<div class="alert" style="border-color:var(--destructive)"><div class="row" style="align-items:flex-start;color:var(--destructive)">${ic("info")}<div><div class="t">Budget oltre le entrate di ${eur0(-rr)}</div><div class="sm">${esc(rn)} è a zero. Riduci qualche voce nella sezione Budget.</div></div></div><button class="btn b-outline b-sm" data-act="goto-budget">Budget</button></div>`;
    else if (rr < mn - 0.5) h += `<div class="alert" style="border-color:var(--destructive)"><div class="row" style="align-items:flex-start;color:var(--destructive)">${ic("info")}<div><div class="t">${esc(rn)} sotto il minimo: ${eur0(rr)} su ${eur0(mn)}</div><div class="sm">Riduci altre voci di ${eur0(mn - rr)} nella sezione Budget.</div></div></div><button class="btn b-outline b-sm" data-act="goto-budget">Budget</button></div>`; }
  h += `<div class="card hero"><div class="card-c stack" style="gap:14px">
    <div class="between" style="align-items:flex-start;flex-wrap:wrap"><div><div class="lbl">${r.isPast ? "Avanzo a fine mese" : "Disponibile questo mese"}</div>
      <div class="big mono" style="color:${left < 0 ? "var(--destructive)" : "var(--foreground)"}">${eur(left)}</div></div>
      ${r.isCur ? `<span class="badge ${projLeft < 0 ? "bd-destructive" : "bd-success"}">${ic(projLeft < 0 ? "down" : "up")}<span class="mono">${sgn(projLeft)}</span> a fine mese</span>` : ""}</div>
    ${progHtml(r.spentTot, r.budTot, r.isCur ? r.projTot : 0, true)}
    <div class="between muted sm"><span>Speso <b class="mono" style="color:var(--foreground);font-weight:500">${eur0(r.spentTot)}</b> di <span class="mono">${eur0(r.budTot)}</span></span><span class="mono">${pct}%</span></div>
  </div></div>
  <div class="stats">
    <div class="card stat"><div class="l"><span class="gd g-inc"></span>Entrate mensili</div><div class="v mono">${eur0(r.income)}</div></div>
    <div class="card stat"><div class="l"><span class="gd" style="background:var(--foreground)"></span>Uscite</div><div class="v mono">${eur0(r.spentTot)}</div></div>
    <div class="card stat"><div class="l"><span class="gd g-ris"></span>Al risparmio</div><div class="v mono">${eur0(r.rows.filter(x => x.c.group === "ris").reduce((a, x) => a + x.b, 0))}</div></div>
  </div>
  <p class="xs muted" style="margin-top:-6px">Entrate mensili = fissi <span class="mono">${eur0(r.inc.fixed)}</span> + fatture degli ultimi 12 mesi <span class="mono">${eur0(r.inc.pool)}</span> ÷ 12${r.inc.invoiced ? ` · fatturato netto questo mese <span class="mono">${eur0(r.inc.invoiced)}</span>` : ""}. ${restCat() ? `Tutto quello che non è a budget va in ${esc(catById(restCat()).name)}, quindi il disponibile è entrate mensili − uscite.` : ""}</p>`;
  const rec = (S.cfg.recurring || []).filter(x => !S.tx.some(t => t.recId === x.id));
  if (rec.length && S.txLoaded && S.month <= curMonth() && started(S.month)) {
    h += `<div class="card"><div class="card-h"><div><div class="card-t">Ricorrenti da registrare</div><div class="card-d">${rec.length} ${rec.length === 1 ? "voce" : "voci"} di questo mese</div></div><button class="btn b-default b-sm" data-act="rec-all">${ic("check")}Registra tutte</button></div><div class="card-c flush">` +
      (() => { const rs = rec.filter(x => x.cat === SUBCAT), other = rec.filter(x => x.cat !== SUBCAT);

function fundStatus() {
  const start = S.cfg.startMonth || curMonth(); const now = curMonth();
  const n = now >= start ? monthDiff(start, now) + 1 : 0;

  const paid = S.fundTx.reduce((a, t) => a + (Number(t.amount) || 0), 0);
  const yr = now.slice(0, 4);
  const upcoming = (S.cfg.annual || []).filter(a => a.due).map(a => {
    let dueM = `${yr}-${pad(a.due)}`; if (dueM < now) dueM = addMonth(dueM, 12);
    const paidYr = S.fundTx.some(t => t.annId === a.id && t.month && t.month.slice(0, 4) === dueM.slice(0, 4));

  }).filter(a => !a.paidYr && monthDiff(now, a.dueM) <= 2).sort((a, b) => a.dueM.localeCompare(b.dueM));
  return {accrued, paid, avail:accrued - paid, upcoming};
}

function trendMonths() { const out = []; for (let m = addMonth(S.month, -11); m <= S.month; m = addMonth(m, 1)) out.push(m); return out; }
let trendLoading = false;
async function loadTrend() {
  const key = S.month + ":" + S.tx.map(t => t.id + t.amount).join() + ":" + JSON.stringify(S.budget?.cats || {}) + ":" + monthlyAccrualAll() + ":" + subsMonthlyRec() + ":" + S.incTx.length + ":" + incomeFor(S.month).monthly;
  if (S.trendCache?.key === key) return drawTrend();
  if (trendLoading) return; trendLoading = true;
  try {
    const res = await Promise.all(trendMonths().map(async m => {
      if (m === S.month) return {m, tx:S.tx, bud:budgetFor().cats};
      const [q, b] = await Promise.all([S.db.collection("tx").where("month", "==", m).get(), S.db.doc("budgets/" + m).get()]);
      return {m, tx:q.docs.map(d => d.data()), bud:b.exists ? b.data().cats : null};
    }));
    let last = null;
    for (const x of res) { if (x.bud) last = x.bud; else x.bud = last || budgetFor().cats; x.r = computeMonth(x.tx, x.bud, x.m); x.has = x.tx.length > 0 || x.m >= (S.cfg.startMonth || x.m); }
    S.trendCache = {key, data:res.filter(x => x.has)};
  } catch (e) { fail(e); } finally { trendLoading = false; }
  if (S.view === "andamento") drawTrend();
}

function yearHtml() {
  const yr = S.month.slice(0, 4), last = S.month.slice(0, 4) === curMonth().slice(0, 4) ? curMonth() : `${yr}-12`;
  const months = [...Array(12)].map((_, i) => `${yr}-${pad(i + 1)}`);

  const net = rows.reduce((a, r) => a + r.net, 0), gross = rows.reduce((a, r) => a + r.gross, 0);

  return `<div class="stats"><div class="stat" style="padding:0"><div class="l">Lordo</div><div class="v mono">${eur0(gross)}</div></div><div class="stat" style="padding:0"><div class="l">Netto</div><div class="v mono">${eur0(net)}</div></div><div class="stat" style="padding:0"><div class="l">Netto ÷ 12</div><div class="v mono">${eur0(net / 12)}</div></div></div>
  <div class="chart" style="margin-top:14px">${svgBars(rows, [{k:"net", c:"var(--income)", n:"Netto"}], 150)}</div>
  <p class="xs muted" style="margin-top:8px">Media di ${n} ${n === 1 ? "mese" : "mesi"}: <span class="mono">${eur0(net / Math.max(1, n))}</span> netti al mese. Le entrate mensili usate per il budget invece contano gli ultimi 12 mesi (<span class="mono">${eur0(incomeFor(S.month).pool)}</span>). Borsa esclusa.</p>`;
}
function svgBars(data, series, h = 190) {
  const W = 640, padL = 44, padB = 22, padT = 8, n = data.length; if (!n) return `<div class="empty">Ancora nessun dato.</div>`;
  const max = Math.max(1, ...data.flatMap(d => series.map(s => d[s.k] || 0)));
  const nice = (() => { const p = Math.pow(10, Math.floor(Math.log10(max))); for (const f of [1, 2, 2.5, 5, 10]) if (f * p >= max) return f * p; return 10 * p; })();
  const bars = series.filter(s => !s.line);
  const cw = (W - padL) / n, bw = Math.min(22, (cw - 10) / bars.length);
  const y = v => padT + (h - padT - padB) * (1 - v / nice);
  let s = `<svg viewBox="0 0 ${W} ${h}" role="img" aria-label="Grafico a barre">`;
  for (let i = 0; i <= 4; i++) { const v = nice * i / 4; s += `<line x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}" stroke="var(--border)" stroke-width="1" ${i ? 'stroke-dasharray="3 3"' : ""}/><text x="${padL - 8}" y="${y(v) + 3}" text-anchor="end">${v >= 1000 ? (v / 1000).toLocaleString("it-IT") + "k" : v}</text>`; }
  data.forEach((d, i) => {
    const cx = padL + cw * i + cw / 2, x0 = cx - bw * bars.length / 2;
    bars.forEach((se, j) => { const v = d[se.k] || 0; const hh = Math.max(0, y(0) - y(v)); s += `<rect x="${x0 + j * bw + 1.5}" y="${y(v)}" width="${Math.max(1, bw - 3)}" height="${hh}" rx="${Math.min(4, hh / 2)}" fill="${se.c}"><title>${esc(d.label)} · ${se.n}: ${eur(v)}</title></rect>`; });
    series.forEach(se => { if (!se.line) return; const v = d[se.k]; if (!v) return; s += `<line x1="${cx - cw / 2 + 6}" x2="${cx + cw / 2 - 6}" y1="${y(v)}" y2="${y(v)}" stroke="${se.c}" stroke-width="2" stroke-dasharray="4 3"><title>${se.n}: ${eur(v)}</title></line>`; });
    s += `<text x="${cx}" y="${h - 6}" text-anchor="middle">${esc(d.label)}</text>`;
  });
  return s + `</svg>`;
}
function drawTrend() {
  const data = S.trendCache?.data || []; const el = $("#tchart"); if (!el) return;

  el.innerHTML = `<div class="legend" style="margin-bottom:10px"><span><i style="background:var(--income)"></i>Entrate mensili</span><span><i style="background:var(--chart-1)"></i>Consumi</span><span><i style="background:var(--chart-3)"></i>Risparmio</span></div>` +
    svgBars(rows, [{k:"inc", c:"var(--income)", n:"Entrate"}, {k:"cons", c:"var(--chart-1)", n:"Consumi"}, {k:"ris", c:"var(--chart-3)", n:"Risparmio"}]);
  const now = curMonth(), yr = now.slice(0, 4);

  const pj = $("#tproj");

    const ytdInc = sumF(done, x => x.r.income) + (cur ? cur.r.income : 0);
    const curInc = cur ? cur.r.income : ym[ym.length - 1].r.income;
    const ytdCons = sumF(done, x => x.r.consumi) + (cur ? cur.r.consumiProj : 0);
    const base = done.length ? done : ym;
    const avgInc = curInc, avgCons = sumF(base, x => x.r.isCur ? x.r.consumiProj : x.r.consumi) / base.length;
    const rem = 12 - Number(now.slice(5, 7));
    const pInc = ytdInc + avgInc * rem, pCons = ytdCons + avgCons * rem, pSav = pInc - pCons;
    const rate = pInc > 0 ? Math.round(pSav / pInc * 100) : null;
    $("#tprojd").textContent = `Stima al 31 dicembre ${yr}, basata su ${base.length} ${base.length === 1 ? "mese" : "mesi"}`;
    pj.innerHTML = `<div class="stats"><div class="stat" style="padding:0"><div class="l"><span class="gd g-inc"></span>Entrate</div><div class="v mono">${eur0(pInc)}</div></div><div class="stat" style="padding:0"><div class="l"><span class="gd g-ext"></span>Consumi</div><div class="v mono">${eur0(pCons)}</div></div><div class="stat" style="padding:0"><div class="l"><span class="gd g-ris"></span>Risparmio</div><div class="v mono" style="color:${pSav < 0 ? "var(--destructive)" : "var(--success)"}">${eur0(pSav)}</div></div></div>
      ${rate != null ? `<div class="stack" style="gap:6px;margin-top:14px"><div class="between sm"><span class="muted">Tasso di risparmio previsto</span><span class="mono" style="font-weight:600">${rate}%</span></div><div class="prog"><i style="width:${Math.max(0, Math.min(100, rate))}%;background:${rate < 0 ? "var(--destructive)" : "var(--success)"}"></i></div></div>` : ""}
      <p class="xs muted" style="margin-top:12px">Mesi chiusi + mese corrente al ritmo attuale; per i ${rem} mesi restanti uso le entrate mensili di oggi e la media dei consumi. Il risparmio è entrate meno consumi, quindi include pensione integrativa, investimenti e salvadanaio.</p>`;
  }
  drawCatTrend();
  const ty = $("#tyear"); if (ty) ty.innerHTML = yearHtml();
  $("#ttable").innerHTML = `<table><thead><tr><th>Mese</th><th class="r">Fatture</th><th class="r">Entrate</th><th class="r">Uscite</th><th class="r">Budget</th><th class="r">Saldo</th></tr></thead><tbody>${rows.slice().reverse().map(r => { const s = r.inc - r.x.r.spentTot; return `<tr><td style="text-transform:capitalize">${esc(mLabel(r.m, {month:"short", year:"2-digit"}))}</td><td class="r mono muted">${eur0(r.x.r.inc.invoiced)}</td><td class="r mono">${eur0(r.inc)}</td><td class="r mono">${eur0(r.x.r.spentTot)}</td><td class="r mono muted">${eur0(r.x.r.budTot)}</td><td class="r"><span class="badge ${s < 0 ? "bd-destructive" : "bd-success"} mono">${sgn(s)}</span></td></tr>`; }).join("")}</tbody></table>`;
}

function readSettings() {
  const cfg = structuredClone(S.cfg);
  const rows = kind => [...document.querySelectorAll(`tr[data-row="${kind}"]`)].map(tr => { const o = {id:tr.dataset.id}; tr.querySelectorAll("[data-f]").forEach(i => { o[i.dataset.f] = i.type === "checkbox" ? i.checked : i.value; }); return o; });
  const prev = (kind, id) => (S.cfg[kind] || []).find(x => x.id === id) || {};
  cfg.annual = rows("annual").filter(a => a.name.trim()).map(a => ({...prev("annual", a.id), id:a.id, name:a.name.trim(), amount:r2(parseAmt(a.amount) || 0), share:Math.max(0, Math.min(100, Number(a.share) || 0)), due:a.due ? Number(a.due) : null}));
  cfg.recurring = [...rows("recurring").filter(a => a.name.trim()).map(a => ({id:a.id, name:a.name.trim(), amount:r2(parseAmt(a.amount) || 0), cat:a.cat})), ...(S.cfg.recurring || []).filter(x => x.cat === SUBCAT)];
  cfg.sources = rows("sources").filter(a => a.name.trim()).map(a => ({id:a.id, name:a.name.trim(), pct:Math.max(0, Math.min(100, Number(a.pct) || 0)), fixed:a.fixed ? r2(parseAmt(a.fixed) || 0) : null}));
  cfg.categories = rows("categories").filter(a => a.name.trim()).map(a => ({...prev("categories", a.id), id:a.id, name:a.name.trim(), group:a.group, fixed:!!a.fixed, defaultBudget:r2(parseAmt(a.defaultBudget) || 0), hidden:!a.active}));
  cfg.incomeHistory = {}; cfg.incomeHistoryGross = {}; rows("hist").forEach(h => { if (/^\d{4}-\d{2}$/.test(h.m)) { cfg.incomeHistory[h.m] = r2(parseAmt(h.v) || 0); cfg.incomeHistoryGross[h.m] = r2(parseAmt(h.g) || 0); } });
  cfg.fundInitial = r2(parseAmt($("#fundInitial").value) || 0);
  cfg.startMonth = $("#startMonth").value || cfg.startMonth;

}

/* ---------- download ---------- */
const downloads = { async save({filename, data, type = "text/csv;charset=utf-8"}) {
  const blob = data instanceof Blob ? data : new Blob([data], {type});
  const file = new File([blob], filename, {type: blob.type});
  if (navigator.canShare?.({files:[file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)) { try { await navigator.share({files:[file]}); return {status:"saved"}; } catch (e) { if (e.name === "AbortError") throw {code:"declined"}; } }
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000); return {status:"saved"};
} };

/* ---------- CSV ---------- */
async function exportCsv(all) {
  const dl = downloads;
  let list;
  if (all) { try { const q = await S.db.collection("tx").orderBy("date", "asc").limit(1000).get(); list = q.docs.map(d => d.data()); } catch (e) { return fail(e); } }
  else list = [...S.tx].reverse();
  const num = n => (n == null || n === "") ? "" : String(r2(n)).replace(".", ",");
  const q = s => `"${String(s ?? "").replace(/"/g, '""')}"`;
  const lines = [["Data", "Tipo", "Categoria/Fonte", "Area", "Importo netto", "Fatturato", "Nota", "Tag"].join(";")];
  for (const t of list) {
    const inc = t.kind === "inc";
    const name = inc ? srcById(t.src)?.name : t.cat === "fondo" ? "Spesa annuale: " + (annualById(t.annId)?.name || "") : catById(t.cat)?.name;
    const area = inc ? "Entrata" : t.cat === "fondo" ? "Fondo annuale" : (GROUPS.find(g => g.id === catById(t.cat)?.group)?.name || "");
    lines.push([t.date, inc ? "Entrata" : "Uscita", q(name), q(area), num(t.amount), inc ? num(t.gross) : "", q(t.note), q(t.tag)].join(";"));
  }
  try { await dl.save({filename:all ? "movimenti-tutti.csv" : `movimenti-${S.month}.csv`, data:"﻿" + lines.join("\r\n")}); }
  catch (e) { if (e?.code !== "declined") toast("Esportazione non riuscita"); }
}

/* ---------- eventi ---------- */
document.addEventListener("click", async e => {
  const tab = e.target.closest("[data-tab]");
  if (tab) { if (S.tagView) { S.unsubTag?.(); S.unsubTag = null; S.tagView = ""; S.tagTx = null; } S.view = tab.dataset.tab; S.settingsDirty = false; if (S.view !== "budget") S.budgetDraft = null; window.scrollTo(0, 0); render(); return; }
  if (e.target.closest("#fab") || e.target.closest("#newBtn")) { if (S.cfg) openSheet(); return; }
  if (e.target.closest("#prevM") || e.target.closest("#nextM")) { S.month = addMonth(S.month, e.target.closest("#prevM") ? -1 : 1); S.settingsDirty = false; S.tagAll = null; subscribeMonth(); render(); return; }
  const s = e.target.closest("[data-s]");
  if (s && sheetState) { readSheetInputs(); sheetState[s.dataset.s] = s.dataset.v; if (s.dataset.s === "kind") { sheetState.cat = ""; sheetState.src = ""; }
    if (s.dataset.s === "src") { const src = srcById(s.dataset.v); if (src?.fixed && !sheetState.amountStr) sheetState.amountStr = String(src.fixed).replace(".", ","); }
    drawSheet(); return; }
  const a = e.target.closest("[data-act]"); if (!a) return;
  const act = a.dataset.act;
  if (act === "s-close") return closeSheet();
  if (act === "open-tag") { e.stopPropagation(); return openTag(a.dataset.tag); }
  if (act === "close-tag") return closeTag();
  if (act === "open-fund") return openFund();
  if (act === "open-subs") return openSubs();
  if (act === "subs-close") return closeSubs();
  if (act === "subs-back") { subState = {mode:"list"}; return drawSubs(); }
  if (act === "subs-new") { subState = {mode:"edit", item:{id:"sub_" + Math.random().toString(36).slice(2, 8), isNew:true, name:"", amountStr:"", freq:"m", due:""}}; return drawSubs(); }
  if (act === "subs-edit") { const x = subs().find(y => y.id === a.dataset.id), y = annSubs().find(z => z.id === a.dataset.id); const it = x || y; if (!it) return;
    subState = {mode:"edit", item:{id:it.id, name:it.name, amountStr:String(it.amount).replace(".", ","), freq:y ? "y" : "m", due:y?.due || ""}}; return drawSubs(); }
  if (act === "subs-freq") { readSubInputs(); subState.item.freq = a.dataset.v; return drawSubs(); }
  if (act === "subs-save") return saveSub();
  if (act === "subs-del") return deleteSub();
  if (act === "subs-movs") { closeSubs(); S.catFilter = SUBCAT; S.tagFilter = ""; S.unsubTag?.(); S.tagView = ""; S.tagTx = null; S.view = "movimenti"; window.scrollTo(0, 0); render(); return; }
  if (act === "fund-close") return closeFund();
  if (act === "fund-back") { fundState = {mode:"list"}; return drawFund(); }
  if (act === "fund-new") { fundState = {mode:"edit", item:{id:"ann_" + Math.random().toString(36).slice(2, 8), isNew:true, name:"", amountStr:"", shareStr:"100", due:""}}; return drawFund(); }
  if (act === "fund-edit") { const x = (S.cfg.annual || []).find(y => y.id === a.dataset.id); if (!x) return; fundState = {mode:"edit", item:{id:x.id, name:x.name, amountStr:String(x.amount ?? 0).replace(".", ","), shareStr:String(x.share ?? 100), due:x.due || ""}}; return drawFund(); }
  if (act === "fund-save") return saveFundItem();
  if (act === "fund-del") return deleteFundItem();
  if (act === "s-save") return saveSheet();
  if (act === "s-del") { if (!sheetState.confirmDel) { readSheetInputs(); sheetState.confirmDel = true; return drawSheet(); } try { await S.db.doc("tx/" + sheetState.id).delete(); closeSheet(); toast("Movimento eliminato"); } catch (er) { fail(er); } return; }
  if (act === "edit") { const t = S.tx.find(x => x.id === a.dataset.id) || (S.tagTx || []).find(x => x.id === a.dataset.id); if (t) openSheet(t); return; }
  if (act === "goto-budget") { S.view = "budget"; window.scrollTo(0, 0); render(); return; }
  if (act === "filter-cat") { S.catFilter = a.dataset.id; S.tagFilter = ""; S.unsubTag?.(); S.tagView = ""; S.tagTx = null; S.view = "movimenti"; window.scrollTo(0, 0); render(); return; }
  if (act === "rec-one" || act === "rec-all" || act === "rec-subs") {
    const list = (S.cfg.recurring || []).filter(x => !S.tx.some(t => t.recId === x.id) && (act === "rec-all" || (act === "rec-subs" ? x.cat === SUBCAT : x.id === a.dataset.id)));
    a.disabled = true;
    const date = S.month === curMonth() ? todayISO() : `${S.month}-01`;
    try { for (const x of list) await S.db.collection("tx").doc().set({kind:"exp", cat:x.cat, amount:r2(x.amount), date, month:S.month, note:x.name, tag:"", recId:x.id, created:Date.now()}); toast(list.length > 1 ? `${list.length} ricorrenti registrate` : "Ricorrente registrata"); }
    catch (er) { fail(er); a.disabled = false; }
    return;
  }
  if (act === "save-budget") {
    const out = {}; for (const [k, v] of Object.entries(S.budgetDraft || {})) { if (catById(k) && k !== restCat()) out[k] = r2(Number(v) || 0); }
    a.disabled = true;
    try { await S.db.doc("budgets/" + S.month).set({month:S.month, cats:out, saved:Date.now()}); S.budgetDraft = null; toast("Budget salvato"); S.view = "mese"; window.scrollTo(0, 0); render(); } catch (er) { fail(er); a.disabled = false; }
    return;
  }
  if (act === "add-row") {
    S.settingsDirty = true; const kind = a.dataset.kind; const tb = a.closest(".card").querySelector("tbody");
    const tr = document.createElement("tr"); tr.dataset.row = kind; tr.dataset.id = kind.slice(0, 3) + "_" + Math.random().toString(36).slice(2, 8);
    const blank = {hist:{}, annual:{share:100}, recurring:{cat:cats()[0]?.id}, sources:{pct:80}, categories:{group:"ext"}}[kind];
    tr.innerHTML = kind === "annual" ? ROW.annual(blank, 0) : ROW[kind](blank);
    tb.appendChild(tr); tr.querySelector("input")?.focus(); return;
  }
  if (act === "del-row") { S.settingsDirty = true; a.closest("tr").remove(); return; }
  if (act === "save-cfg") {
    const cfg = readSettings(); a.disabled = true;
    try { await S.db.doc("config/main").set(cfg); S.settingsDirty = false; toast("Impostazioni salvate"); render(); } catch (er) { fail(er); a.disabled = false; }
    return;
  }
  if (act === "backup-export") { try { await downloads.save({filename:`conti-backup-${todayISO()}.json`, data:JSON.stringify(window.__cloud.exportBackup()), type:"application/json"}); } catch (er) { if (er?.code !== "declined") toast("Backup non riuscito"); } return; }
  if (act === "logout") return window.__cloud.signOut();
  if (act === "change-pwd") { const v = $("#newPwd").value; if (v.length < 8) return toast("Almeno 8 caratteri"); const { error } = await window.__auth.updatePassword(v); if (error) toast("Password non cambiata: " + error.message); else { $("#newPwd").value = ""; toast("Password aggiornata"); } return; }
  if (act === "export-month") return exportCsv(false);
  if (act === "export-all") return exportCsv(true);
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset?.bud != null && S.budgetDraft) {
    S.budgetDraft[t.dataset.bud] = parseAmt(t.value) || 0;
    const el = $("#btot"); if (el) el.textContent = eur0(budgetTotal());
    const bm = $("#bmargin"); if (bm) bm.innerHTML = marginHtml();
    const rv = $("#restVal"); if (rv) rv.textContent = eur(Math.max(0, restFor(S.budgetDraft)));
    GROUPS.forEach(g => { const gs = document.querySelector(`[data-gsub="${g.id}"]`); if (gs) gs.textContent = eur0(budCatsFor(S.budgetDraft).filter(c => c.group === g.id).reduce((a, c) => a + budOf(c, S.budgetDraft), 0)); });
  }
  if (t.closest?.("#settings")) S.settingsDirty = true;
  if ((t.id === "fAmt" || t.id === "fShare") && $("#fMonthly")) { const v = parseAmt($("#fAmt").value || "0"), sh = $("#fShare").value === "" ? 100 : Number($("#fShare").value); $("#fMonthly").textContent = eur((isFinite(v) ? v : 0) * ((isFinite(sh) ? sh : 100) / 100) / 12); }
  if (t.id === "sAmt" && sheetState?.kind === "inc") { const src = srcById(sheetState.src); const n = $("#sNet"); const v = parseAmt(t.value); if (n && src) n.innerHTML = isFinite(v) ? `Netto (${src.pct}%) <b class="mono" style="color:var(--foreground)">${eur(v * src.pct / 100)}</b>` : `Netto al ${src.pct}% del fatturato`; }
});
document.addEventListener("change", e => {
  if (e.target.id === "fcat") { S.catFilter = e.target.value; render(); }
  if (e.target.id === "ftag") { if (e.target.value) openTag(e.target.value); }
  if ((e.target.id === "backupFile" || e.target.id === "backupFile0") && e.target.files?.[0]) { const f = e.target.files[0]; f.text().then(async txt => { try { const n = await window.__cloud.importBackup(JSON.parse(txt)); S.trendCache = null; toast(`Importati ${n} elementi`); } catch (er) { console.error(er); toast("File di backup non valido"); } e.target.value = ""; }); }
  if (e.target.id === "restMin") { const v = Math.max(0, parseAmt(e.target.value) || 0); const cfg = structuredClone(S.cfg); cfg.restMin = r2(v); S.cfg = cfg; render(); S.db.doc("config/main").set(cfg).then(() => toast("Minimo impostato a " + eur0(v))).catch(fail); }
  if (e.target.id === "restSel") { const cfg = structuredClone(S.cfg); cfg.restCat = e.target.value; S.cfg = cfg; render(); S.db.doc("config/main").set(cfg).then(() => toast("Il resto ora va in " + catById(cfg.restCat)?.name)).catch(fail); }
  if (e.target.id === "tcat") { S.trendCat = e.target.value; drawCatTrend(); }
});
document.addEventListener("keydown", e => {
  if (subState) { if (e.key === "Escape") closeSubs(); if (e.key === "Enter" && e.target.tagName === "INPUT" && subState.mode === "edit") { e.preventDefault(); saveSub(); } return; }
  if (fundState) { if (e.key === "Escape") closeFund(); if (e.key === "Enter" && e.target.tagName === "INPUT" && fundState.mode === "edit") { e.preventDefault(); saveFundItem(); } return; }
  if (!sheetState) return;
  if (e.key === "Escape") closeSheet();
  if (e.key === "Enter" && e.target.tagName === "INPUT") { e.preventDefault(); saveSheet(); }
});

window.__bootApp = boot; if (window.__db) boot();
})();
</script>

<div class="login" id="login" hidden><div class="box">
  <img class="logo" src="icons/icon-192.png" alt="">
  <h1>Conti</h1><p class="sub" id="lgSub">Accedi per vedere i tuoi conti</p>
  <form class="card card-c stack" id="lgForm" style="gap:12px">
    <div class="field"><label for="lgEmail">Email</label><input class="inp" id="lgEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="lgPwd">Password</label><input class="inp" id="lgPwd" type="password" autocomplete="current-password" minlength="8" required></div>
    <button class="btn b-default" id="lgBtn" type="submit">Accedi</button>
    <div class="msg" id="lgMsg" role="status"></div>
    <div class="between sm"><button class="btn b-ghost b-sm" type="button" id="lgToggle">Crea un account</button><button class="btn b-ghost b-sm" type="button" id="lgReset">Password dimenticata?</button></div>
  </form>
</div></div>
<div class="login" id="recover" hidden><div class="box">
  <h1>Nuova password</h1><p class="sub">Scegli la nuova password per il tuo account</p>
  <form class="card card-c stack" id="rcForm" style="gap:12px"><div class="field"><label for="rcPwd">Nuova password</label><input class="inp" id="rcPwd" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn b-default" type="submit">Salva password</button><div class="msg" id="rcMsg"></div></form>
</div></div>
<script src="vendor/supabase.js"></script>
<script src="cloud.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  let mode = "in";
  const app = [...document.querySelectorAll(".hdr,#view,#fab,.bnav")];
  const showLogin = () => { app.forEach(e => e.hidden = true); $("#login").hidden = false; };
  const showApp = () => { $("#login").hidden = true; app.forEach(e => e.hidden = false); };
  const msg = (t, err) => { $("#lgMsg").textContent = t; $("#lgMsg").style.color = err ? "var(--destructive)" : "var(--muted-foreground)"; };
  $("#lgToggle").onclick = () => { mode = mode === "in" ? "up" : "in"; $("#lgBtn").textContent = mode === "in" ? "Accedi" : "Crea account"; $("#lgToggle").textContent = mode === "in" ? "Crea un account" : "Ho già un account"; $("#lgSub").textContent = mode === "in" ? "Accedi per vedere i tuoi conti" : "Crea il tuo account personale"; $("#lgPwd").autocomplete = mode === "in" ? "current-password" : "new-password"; msg(""); };
  $("#lgReset").onclick = async () => { const e = $("#lgEmail").value.trim(); if (!e) return msg("Scrivi prima la tua email", true); const { error } = await window.__auth.reset(e); msg(error ? error.message : "Ti ho inviato un'email per reimpostare la password.", !!error); };
  $("#lgForm").onsubmit = async ev => { ev.preventDefault(); const e = $("#lgEmail").value.trim(), p = $("#lgPwd").value; $("#lgBtn").disabled = true; msg(mode === "in" ? "Accesso in corso…" : "Creazione account…");
    const { data, error } = mode === "in" ? await window.__auth.signIn(e, p) : await window.__auth.signUp(e, p);
    $("#lgBtn").disabled = false;
    if (error) return msg(/Invalid login/i.test(error.message) ? "Email o password non corretti." : /not confirmed/i.test(error.message) ? "Conferma prima l'email: controlla la posta." : error.message, true);
    if (mode === "up" && !data.session) return msg("Account creato. Apri l'email di conferma, poi torna qui e accedi.");
  };
  $("#rcForm").onsubmit = async ev => { ev.preventDefault(); const { error } = await window.__auth.updatePassword($("#rcPwd").value); if (error) { $("#rcMsg").textContent = error.message; return; } $("#recover").hidden = true; showApp(); };
  window.__onRecovery = () => { app.forEach(e => e.hidden = true); $("#login").hidden = true; $("#recover").hidden = false; };
  window.__showApp = showApp;
  window.__auth.init(showLogin);
  if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
})();
</script>
</body>
